name: build projects.json via build.js

on:
  push:
    branches: [main]
    paths: [build/**]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node build/build.js
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add   apps/site/public/test.json
          git commit -m "updated test.json via github actions" || echo "No changes"
          git push