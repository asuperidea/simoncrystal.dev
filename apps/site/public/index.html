<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Crystal</title>
    <link href="style.css" rel="stylesheet" />
    <link href="index.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <script src="projects.js"></script>
    <div id="mobilewarn" class="mobilewarn">
        <h1 class="text-center warntext colorpri fs-3">This Website Is Better On Desktops!</h1>
    </div>
    <div id="hero" class="hero d-flex flex-column align-items-center">
        <div id="social" class="d-flex mx-auto justify-content-center gap-5 social">
            <a href="https://instagram.com/asuperidea"><img src="images/instagram.svg" style="width: 1.5rem;"></a>
            <a href="https://github.com/asuperidea"><img src="images/github.svg" style="width: 1.5rem;"></a>
        </div>
        <div id="headline" class="headline">
        <h1 class="poiret-reg text-center headlinetx">I'm Simon, learning and engaging in 
            Software Development, 
            Robotics, 
            Electronics,
            CAD, and
            Meteorology</h1>
        <hr class="mx-auto mt-4 border-black" style="width: 80%;">
        <div class="d-flex justify-content-center gap-3 mt-3 details">
            <div class="d-flex justify-content-center gap-2 detailpiece">
                <img src="images/location.svg" class="detailimg">
                <p class="fs-6 jost-light mt-1">North Carolina</p>
            </div>
            <div class="d-flex justify-content-center gap-2 detailpiece">
                <img src="images/school.svg" class="detailimg">
                <p class="fs-6 jost-light mt-1">Tenth Grade</p>
            </div>
        </div>
        </div>
        <div id="techcont" class="d-flex mt-auto mb-2 techcont">
        </div>
    </div>
    <div id="projects" class="projects">
        <div class="projectheadline">
            <h1 class="fs-1 poiret-reg text-center colorpri">Projects</h1>
        </div>
        <div class="mx-auto projectcards" id="projectcards">
        </div>
    </div>
    <div id="blogs" class="blogs">
        <div class="blogsheadline">
            <h1 class="fs-1 poiret-reg text-center colorpri">My Blog</h1>
        </div>
        <div class="mx-auto blogcards" id="blogcards"></div>
    </div>
</body>
</html>
